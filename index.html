<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Замер Про">
<meta name="theme-color" content="#eef6fb">
<meta name="format-detection" content="telephone=no">
<title>Замер Про</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Экран папки (корень = «Заказы») -->
<section id="screen-folder" class="screen active">
  <header class="bar">
    <button id="btn-up" class="eicon hidden" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="folder-title">Заказы</h1>
    <button id="btn-menu" class="eicon" aria-label="Меню">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
    <button id="btn-edit" class="text-btn">Правка</button>
  </header>
  <main class="content">
    <div id="install-tip" class="tip hidden">
      <span id="install-text"></span>
      <button id="tip-close" aria-label="Закрыть">✕</button>
    </div>
    <div id="order-card"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">
      <div class="empty-icon">📁</div>
      <p id="empty-text"></p>
    </div>
  </main>

  <!-- Путь: 🏠 › Заказ › Кухня -->
  <nav id="crumbs" class="crumbs"></nav>

  <!-- Режим «Правка»: действия с выбранным -->
  <div id="selbar" class="selbar hidden">
    <span id="sel-count"></span>
    <button id="sel-share" class="text-btn">Отправить</button>
    <button id="sel-move" class="text-btn">Переместить</button>
    <button id="sel-delete" class="text-btn danger">Удалить</button>
  </div>

  <!-- Круглая «+» и её меню -->
  <div id="fab-dim" class="fab-dim hidden"></div>
  <div id="fab-menu" class="fab-menu hidden">
    <button data-act="plan" class="fab-item"><span>План в клетку</span><i>▦</i></button>
    <button data-act="folder" class="fab-item"><span>Создать папку</span><i>📁</i></button>
    <button data-act="gallery" class="fab-item"><span>Из галереи</span><i>🖼</i></button>
    <button data-act="camera" class="fab-item"><span>Снимок</span><i>📷</i></button>
  </div>
  <button id="fab" class="fab-plus" aria-label="Добавить">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</section>

<!-- Редактор фото / плана -->
<section id="screen-editor" class="screen">
  <!-- Фото на весь экран, панели — полупрозрачные поверх -->
  <div class="stage"><canvas id="cv"></canvas></div>
  <header id="ebar" class="ebar">
    <button id="btn-back" class="eicon" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="photo-title" class="etitle"></h1>
    <button id="btn-undo" class="eicon" aria-label="Отменить">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></svg>
    </button>
    <button id="btn-redo" class="eicon" aria-label="Вернуть">
      <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3"/></svg>
    </button>
    <button id="btn-share" class="eicon" aria-label="Отправить">
      <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></svg>
    </button>
  </header>
  <button id="btn-lock" class="lock" aria-label="Замок: только просмотр">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="lock-shackle" d="M8 11V7a4 4 0 018 0"/></svg><span id="lock-text"></span>
  </button>
  <div id="hint" class="hint"></div>
  <div id="inspector" class="inspector hidden"></div>
  <div id="stylebox" class="stylebox hidden"></div>
  <nav id="toolbar" class="toolbar">
    <button data-tool="arrow" class="tool">
      <svg viewBox="0 0 24 24"><path d="M4 12h16M4 12l4-4M4 12l4 4M20 12l-4-4M20 12l-4 4"/></svg><i class="tdot"></i><span>Стрелка</span>
    </button>
    <button data-tool="line" class="tool">
      <svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg><i class="tdot"></i><span>Линия</span>
    </button>
    <button data-tool="pen" class="tool">
      <svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg><i class="tdot"></i><span>Карандаш</span>
    </button>
    <button data-tool="text" class="tool">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9 19h6"/></svg><i class="tdot"></i><span>Заметка</span>
    </button>
  </nav>
  <!-- Своя цифровая клавиатура для размера -->
  <div id="keypad" class="keypad hidden"></div>
</section>

<!-- Нижнее меню действий и формы -->
<div id="sheet" class="sheet hidden"><div id="sheet-panel" class="sheet-panel"></div></div>
<div id="busy" class="busy hidden"><div class="busy-box"><div class="spinner"></div><span id="busy-text">Готовлю…</span></div></div>
<div id="toast" class="toast hidden"></div>

<input id="file-camera" type="file" accept="image/*" capture="environment" hidden>
<input id="file-photo" type="file" accept="image/*" multiple hidden>
<input id="file-import" type="file" accept=".json,.zamer,application/json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
